name: Security

# Known-vulnerability checks on the libraries we ship (standards §7). Runs on every PR, on main,
# and weekly, because a new advisory can appear for code that has not changed.
# Code scanning of our own code: Semgrep below (our rules in .semgrep/ plus public community
# rule packs) and ruff's `S` (bandit) rules in the Backend job; the secret scan is in ci.yml.
# GitHub CodeQL needs a paid plan for private repositories, so it is not used.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC (08:47 India)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-deps:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          working-directory: services/api
      # Exactly the versions in uv.lock (with their hashes), checked against the PyPI/OSV
      # advisory databases. --strict: a package that cannot be checked is a failure too.
      - run: uv export --frozen --no-emit-project --format requirements-txt --quiet -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit==2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  web-deps:
    name: Web dependencies (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # Libraries that end up in the running app (pnpm-lock.yaml); moderate severity or worse fails.
      # Developer-only tools (linters, test runners) are left out: they never reach users.
      - run: pnpm audit --prod --audit-level moderate

  code-scan:
    name: Code scanning (Semgrep)
    runs-on: ubuntu-latest
    env:
      # Pinned: a new Semgrep release can change what is found. Dependabot does not manage this
      # line, so move it by hand when you want newer rules and engine.
      SEMGREP: semgrep==1.182.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      # Our own rules (.semgrep/rules) must still catch what their test files say they catch.
      - name: Our rules pass their own tests
        run: uvx --from "$SEMGREP" semgrep --test --config .semgrep/rules .semgrep/tests
      # Our rules apply to the whole repository (each limits itself to its own folders).
      - name: Scan with our rules (AGENTS.md "Never" list)
        run: >-
          uvx --from "$SEMGREP" semgrep scan --metrics=off --disable-version-check --error
          --config .semgrep/rules
      # Public community packs for common vulnerability patterns. Tests, end-to-end tests and
      # generated code are left out: they build inputs on purpose or are not ours to change.
      - name: Scan with community rule packs
        run: >-
          uvx --from "$SEMGREP" semgrep scan --metrics=off --disable-version-check --error
          --config p/python --config p/typescript --config p/react --config p/owasp-top-ten
          --exclude tests --exclude apps/e2e --exclude .semgrep --exclude packages/api-client/src
