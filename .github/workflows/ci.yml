name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qbank_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qbank_owner -d postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      QBANK_TEST_ADMIN_URL: postgresql+psycopg://qbank_owner:ci-owner-password@localhost:5432/postgres
      QBANK_TEST_APP_PASSWORD: ci-app-password
      QBANK_TEST_WORKER_PASSWORD: ci-worker-password
      # The restore drill (tests/integration/test_backup_restore.py) runs pg_dump and pg_restore from
      # this image so their version matches the server. Keep it equal to the postgres service above.
      PG_DOCKER_IMAGE: postgres:17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: services/api
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - name: API contract matches the code (api/openapi.json)
        run: uv run qbank export-openapi --check
      - run: uv run pytest   # unit + API + integration (real PostgreSQL, incl. migrations)

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generated API client matches api/openapi.json
        run: pnpm --filter @qbank/api-client check-generated
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    # Browser tests (apps/e2e): the whole stack from compose.yaml, driven by a real Chromium.
    name: Browser tests (e2e)
    # Pinned: "ubuntu-latest" moved to 26.04 on 22 Oct 2026, which Playwright 1.56 cannot install
    # Chromium on. Move to "ubuntu-latest" again when Playwright is upgraded to support it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qbank/e2e exec playwright install --with-deps chromium
      - name: Start the app (docker compose, default local settings)
        env:
          # The tests sign in and use links from one address, far more often than a person would.
          LOGIN_ATTEMPTS_PER_IP: "1000"
          LOGIN_ATTEMPTS_PER_EMAIL: "1000"
        run: |
          docker compose up --build -d
          deadline=$((SECONDS + 300))
          until curl -sf -o /dev/null --max-time 5 http://localhost:3000/login \
            && curl -sf -o /dev/null --max-time 5 http://localhost:8000/health/ready; do
            if [ "$SECONDS" -ge "$deadline" ]; then echo "The app did not start."; exit 1; fi
            sleep 3
          done
      - name: Create the test platform admin (random password, hidden in logs)
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "E2E_ADMIN_EMAIL=e2e-admin@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$password" "$password" | docker compose run --rm -T migrate \
            qbank create-platform-admin --email e2e-admin@example.com --name "E2E Admin"
      - run: pnpm --filter @qbank/e2e e2e
      - name: Show the app's logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Keep the test report (screenshots, traces)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  contract:
    # API style guide §8: no breaking changes inside /api/v1. Compares this PR's api/openapi.json
    # with the base branch's (removed endpoints, new required inputs, changed types...).
    name: API contract (no breaking changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compare with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          OASDIFF: tufin/oasdiff:v1.34.0@sha256:dd742562c1f3146f6e2a80bc01951cc87d15a249ac2aca05665339e30cf03620
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if ! git show "origin/$BASE_REF:api/openapi.json" > "$RUNNER_TEMP/base/openapi.json" 2>/dev/null; then
            echo "No api/openapi.json on $BASE_REF yet: nothing to compare."
            exit 0
          fi
          docker run --rm -v "$RUNNER_TEMP/base:/base:ro" -v "$PWD/api:/head:ro" "$OASDIFF" \
            breaking /base/openapi.json /head/openapi.json --fail-on ERR

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists the PR's commits to scan only those
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
