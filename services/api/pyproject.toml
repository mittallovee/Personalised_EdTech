[project]
name = "qbank"
version = "0.1.0"
description = "Question bank platform backend (API + worker)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.144,<0.145",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "structlog>=26.1,<27",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.3,<3",
    "tzdata>=2025.2",
    "joserfc>=1.7,<2",
    "httpx2>=2.13,<3",
    "defusedxml>=0.7.1,<1",
    "prometheus-client>=0.23,<1",
]

[project.scripts]
qbank = "qbank.cli:run"

[dependency-groups]
dev = [
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "import-linter>=2.15,<3",
    "types-openpyxl>=3.1.5.20261017",
    "types-defusedxml>=0.7.0.20260504",
    "openpyxl>=3.1,<4",
    "hypothesis>=6.140,<7",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes, I: imports, B: bugbear, UP: pyupgrade, S: bandit (security),
# N: naming, SIM: simplifications, RUF: ruff-specific, DTZ: timezone-aware datetimes.
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "DTZ"]
# Domain errors read as plain words (NotFound, Conflict), matching the API error codes.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # pytest asserts; obviously fake test passwords

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
packages = ["qbank"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL server (see tests/integration/conftest.py)",
]
filterwarnings = ["error"]

[tool.importlinter]
root_package = "qbank"

[[tool.importlinter.contracts]]
name = "feature modules are independent: they may only use each other's public.py"
type = "independence"
modules = [
    "qbank.modules.audit",
    "qbank.modules.health",
    "qbank.modules.identity",
    "qbank.modules.organizations",
    "qbank.modules.questions",
    "qbank.modules.taxonomy",
]
ignore_imports = [
    "qbank.modules.** -> qbank.modules.*.public",
]

[[tool.importlinter.contracts]]
name = "core must not depend on feature modules"
type = "forbidden"
source_modules = ["qbank.core"]
forbidden_modules = ["qbank.modules"]
