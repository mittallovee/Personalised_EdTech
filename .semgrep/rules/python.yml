# Project rules for the backend (K-02). Each one enforces a line of AGENTS.md "Never" that
# ruff's S rules and import-linter do not already cover. Tests: .semgrep/tests (semgrep --test).
rules:
  - id: qbank-no-rls-bypass
    message: >-
      Do not weaken row-level security or the database role (AGENTS.md §3, ADR-0005): no role that is
      given BYPASSRLS, no disabling or un-forcing row-level security, no `row_security = off`. (A
      dedicated backup role may need BYPASSRLS: create it in infrastructure code, not here.)
    severity: ERROR
    languages: [python]
    paths:
      include: ["/services/api/src/", "/services/api/migrations/"]
    # Any string literal (f-strings too) in backend code that contains the word BYPASSRLS, or turns
    # row_security off, or un-forces or disables row-level security, is a finding. Not
    # NOBYPASSRLS and not the column name rolbypassrls (a letter before the word). Matching the
    # bare word, not a whole CREATE/ALTER ROLE statement, also catches a command assembled from
    # several pieces ("ALTER ROLE app " + option). Nothing in services/api/src or migrations uses the
    # word today; if prose in a string ever needs it, keep it in a comment or add a reviewed
    # `nosemgrep` that says why. (metavariable-regex matches from the start, hence the leading .*)
    patterns:
      - pattern-either:
          - pattern: '"$S"'
          - pattern: 'f"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: '(?is).*((?<![a-z])bypassrls\b|row_security\s*(=|to)\s*off|no\s+force\s+row\s+level\s+security|disable\s+row\s+level\s+security)'

  - id: qbank-sql-text-built-from-string
    message: >-
      SQL must not be built by concatenating or formatting strings (AGENTS.md §3). Pass values as
      bind parameters: text("... :name ..."), {"name": value}.
    severity: ERROR
    languages: [python]
    paths:
      include: ["/services/api/src/", "/services/api/migrations/"]
    pattern-either:
      - pattern: text(f"...", ...)
      - pattern: text("..." + $X, ...)
      - pattern: text($X + "...", ...)
      - pattern: text("..." % $X, ...)
      - pattern: text("...".format(...), ...)

  - id: qbank-no-float-column
    message: >-
      Do not store money or numerical answers as floats (AGENTS.md §3): use Numeric / Integer.
    severity: ERROR
    languages: [python]
    paths:
      include: ["/services/api/src/", "/services/api/migrations/"]
    pattern-either:
      - pattern: Float(...)
      - pattern: sa.Float(...)
      - pattern: sqlalchemy.Float(...)
      - pattern: Double(...)

  - id: qbank-no-secret-in-log
    message: >-
      Do not log a password, token, secret or key (standards §5.5). Log an identifier instead.
    severity: ERROR
    languages: [python]
    paths:
      include: ["/services/api/src/"]
    patterns:
      - pattern-either:
          - pattern: $LOG.debug(..., $K=$V, ...)
          - pattern: $LOG.info(..., $K=$V, ...)
          - pattern: $LOG.warning(..., $K=$V, ...)
          - pattern: $LOG.error(..., $K=$V, ...)
          - pattern: $LOG.exception(..., $K=$V, ...)
          - pattern: $LOG.critical(..., $K=$V, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: '^(log|logger|_log|_logger)$'
      - metavariable-regex:
          metavariable: $K
          regex: '(?is).*(password|passwd|secret|token|api_?key|authorization|cookie|credential)'
