# Tempo keeps traces on local disk for 7 days (ADR-0019).
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
# Tempo 3 splits retention over a scheduler (decides) and a worker (deletes): set both to 7 days.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h
backend_worker:
  compaction:
    block_retention: 168h
