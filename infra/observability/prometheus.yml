# Prometheus collects the numbers the API and worker publish on their metrics ports (ADR-0019).
# Those ports are only reachable inside the compose network. Kept for 15 days (see compose.yaml).
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: qbank-api
    static_configs:
      - targets: ["api:9100"]
  - job_name: qbank-worker
    static_configs:
      - targets: ["worker:9101"]
