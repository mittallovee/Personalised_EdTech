# Grafana opens with all three data sources ready, linked so you can jump between them:
# a log line's trace_id opens its trace, and a trace opens the log lines of the same trace_id.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":\s*"(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Open trace
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        query: '{service_name=~"qbank-.+"} |= "$${__trace.traceId}"'
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
